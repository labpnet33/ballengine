    Poisoned-asset self-heal. /assets/* is served with `max-age=1y, immutable`, and
    Cloudflare applies those headers BY REQUEST PATH — so if an asset request ever
    transiently returns the SPA-fallback HTML (deploy propagation race), the browser
    caches that HTML as the asset FOR A YEAR and `immutable` means it never revalidates.
    Strict MIME checking then refuses the "stylesheet"/"script" on every load, and even
    reinstalling the desktop app doesn't clear the WebView2 profile cache. This must be
    INLINE in the document (which always revalidates): when a same-origin /assets/*
    stylesheet or script fails, re-request it once with a cache-busting query (a new URL
    bypasses the poisoned cache entry). If the busted URL fails too, the HTML itself is
    stale — reload the page once (sessionStorage-guarded) to fetch a fresh document.
  -->
  <script>
    (function () {
      function heal(t, isLink) {
        var attr = isLink ? 'href' : 'src';
        var url = t.getAttribute(attr) || '';
        // Only heal our own hashed assets; external CDNs manage themselves.
        if (url.indexOf('/assets/') !== 0 &&
            url.indexOf(location.origin + '/assets/') !== 0) return;
        if (url.indexOf('cachebust=') === -1) {
          var busted = url + (url.indexOf('?') > -1 ? '&' : '?') + 'cachebust=' + Date.now();
          var n;
          if (isLink) {
            n = t.cloneNode();
            n.setAttribute('href', busted);
          } else {
            // Cloned <script> elements never execute (the "already started" flag is
            // copied), so build a fresh element and copy the attributes across.
            n = document.createElement('script');
            for (var i = 0; i < t.attributes.length; i++) {
              n.setAttribute(t.attributes[i].name, t.attributes[i].value);
            }
            n.setAttribute('src', busted);
          }
          (t.parentNode || document.head).insertBefore(n, t.nextSibling);
          if (t.parentNode) t.parentNode.removeChild(t);
        } else if (!sessionStorage.getItem('assetHealReloaded')) {
          sessionStorage.setItem('assetHealReloaded', '1');
          location.reload();
        }
      }
      // 404s / network failures fire `error` on the element.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || !t.tagName || t === window) return;
        if (t.tagName === 'LINK' && t.rel === 'stylesheet') heal(t, true);
        else if (t.tagName === 'SCRIPT' && t.src) heal(t, false);
      }, true);
      // A stylesheet whose response is HTML fires `load` (not error) and is then
      // refused by strict MIME checking — the tell is link.sheet === null.
      window.addEventListener('load', function (e) {
        var t = e.target;
        if (!t || t === window || t.tagName !== 'LINK' || t.rel !== 'stylesheet') return;
        if (!t.sheet) heal(t, true);
      }, true);
    })();

    Kick the hero reels request off before the bundle exists.

    The homepage's first visual comes from /api/hero-reels, and that call lives in a React
    effect — so it could not start until 2.4MB of JavaScript had downloaded, parsed and
    mounted. Measured cold, the request began at ~2.76s and the thumbnails it names only

    firing it here puts it in the HTTP cache long before the app asks, and the app's own
    fetch is then served from cache instead of crossing the network.

    The parsed body is parked on window.__heroReelsPrefetch and home.tsx CONSUMES it, so this is
    the only /api/hero-reels request of the page load. It used to be a bare warm-up that the app
    then repeated, which still put a second (sometimes third) request on the wire. The promise
    resolves null on any failure and never rejects; home.tsx falls back to its own fetch then.
  -->
  <script>
    try {
      window.__heroReelsPrefetch = fetch('/api/hero-reels')
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    } catch (e) { /* no fetch: the app's own call still runs */ }
  </script>
