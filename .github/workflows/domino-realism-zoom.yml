name: Verify Domino 3D realistic tiles and manual zoom
on:
  push:
    branches: [fix/27-modes-native-controls-preview]
    paths:
      - scripts/test-domino-realism-zoom.cjs
      - .github/workflows/domino-realism-zoom.yml
      - scripts/build-original-studio.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domino-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Chromium browser controller
        run: npm install --prefix "$RUNNER_TEMP/domino-qa" --no-save --no-audit --no-fund playwright-core@1.56.0
      - name: Build original Studio with Domino zoom and materials
        run: node scripts/build-original-studio.cjs
      - name: Test live zoom without refresh
        env:
          NODE_PATH: ${{ runner.temp }}/domino-qa/node_modules
        run: CHROME_BIN="$(command -v google-chrome)" node scripts/test-domino-realism-zoom.cjs
      - name: Save before/after screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: domino-realism-zoom-evidence
          path: test-results/domino-realism/
          if-no-files-found: ignore
          retention-days: 7
