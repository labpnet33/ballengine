name: Inspect experimental Randomize history
on:
  push:
    branches: [dev/complete-27-mode-engines]
    paths:
      - scripts/inspect-randomizer-history.cjs
      - .github/workflows/inspect-randomizer-history.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect release registry and history handlers
        run: node scripts/inspect-randomizer-history.cjs
