name: Inspect original Domino 3D renderer
on:
  push:
    branches: [fix/27-modes-native-controls-preview]
    paths:
      - scripts/inspect-domino-3d.cjs
      - .github/workflows/inspect-domino-3d.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-domino:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node scripts/inspect-domino-3d.cjs
