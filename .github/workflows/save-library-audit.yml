name: Diagnose captured BallEngine Saves API
on:
  push:
    branches: [fix/production-home-route]
    paths:
      - scripts/audit-save-api.cjs
      - .github/workflows/save-library-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build captured original frontend
        run: node scripts/build-original-studio.cjs
      - name: Inspect saves API frontend contracts
        run: node scripts/audit-save-api.cjs
      - name: Archive the original public browser bundle for code inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-bundle-audit
          path: extra/wget/ballengine.app/assets/index-3pf76ICO.js
          retention-days: 1
