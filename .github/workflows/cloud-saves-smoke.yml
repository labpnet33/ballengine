name: Verify BallEngine cloud project saves
on:
  push:
    branches: [fix/production-home-route]
    paths:
      - cloud-saves/**
      - scripts/test-cloud-worker.cjs
      - scripts/ballengine-cloud-saves.js
      - scripts/build-original-studio.cjs
      - .github/workflows/cloud-saves-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-saves-api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Worker JavaScript
        run: node --check cloud-saves/worker.mjs
      - name: Validate cloud browser adapter
        run: node --check scripts/ballengine-cloud-saves.js
      - name: Test remote cloud project API
        run: node scripts/test-cloud-worker.cjs
