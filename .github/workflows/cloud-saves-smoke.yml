name: Verify BallEngine cloud project saves
on:
  push:
    branches: [fix/production-home-route]
    paths:
      - cloud-saves/**
      - scripts/test-cloud-worker.cjs
      - scripts/test-cloud-save-ui.cjs
      - scripts/ballengine-cloud-saves.js
      - scripts/build-original-studio.cjs
      - .github/workflows/cloud-saves-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-saves-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Worker JavaScript
        run: node --check cloud-saves/worker.mjs
      - name: Validate cloud browser adapter
        run: node --check scripts/ballengine-cloud-saves.js
      - name: Test remote cloud project API
        run: node scripts/test-cloud-worker.cjs
      - name: Install browser testing dependency
        run: npm install --prefix "$RUNNER_TEMP/studio-qa" --no-save --no-audit --no-fund playwright-core@1.56.0
      - name: Build original Studio
        run: node scripts/build-original-studio.cjs
      - name: Test local saves and real cloud UI across browsers
        run: |
          CHROME_BIN="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/studio-qa/node_modules" node scripts/test-cloud-save-ui.cjs
      - name: Upload cloud UI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ballengine-cloud-save-ui
          path: test-results/cloud-saves/
          if-no-files-found: ignore
          retention-days: 7
