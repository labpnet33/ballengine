name: Verify BallEngine live guest Automation status
on:
  push:
    branches: [fix/production-home-route]
    paths:
      - scripts/test-live-automation-guest.cjs
      - .github/workflows/live-guest-automation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-automation-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser test client
        run: npm install --prefix "$RUNNER_TEMP/automation-live" --no-save --no-audit --no-fund playwright-core@1.56.0
      - name: Validate deployed production script, original Automation page and guest status
        run: CHROME_BIN="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/automation-live/node_modules" node scripts/test-live-automation-guest.cjs
