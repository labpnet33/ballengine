name: Audit original BallEngine publishing controls
on:
  push:
    branches: [fix/production-home-route]
    paths:
      - scripts/audit-publishing.cjs
      - .github/workflows/publishing-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node scripts/audit-publishing.cjs
      - name: Install Playwright
        run: npm install --prefix "$RUNNER_TEMP/studio-qa" --no-save --no-audit --no-fund playwright-core@1.56.0
      - name: Build original Studio
        run: node scripts/build-original-studio.cjs
      - name: Inspect original Automation and Publish UI
        run: CHROME_BIN="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/studio-qa/node_modules" node scripts/test-publishing-audit-ui.cjs
