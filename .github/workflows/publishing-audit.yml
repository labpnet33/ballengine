name: Audit original BallEngine publishing controls
on:
  push:
    branches: [fix/production-home-route]
    paths:
      - scripts/audit-publishing.cjs
      - .github/workflows/publishing-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node scripts/audit-publishing.cjs
